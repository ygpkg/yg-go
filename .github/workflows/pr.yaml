name: Go Lint Check

on:
  pull_request:
    branches:
      - main  # 或者你的默认分支
      - master

jobs:
  build:
    name: Analyze Go Code
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.27.4'  # 指定Go的版本

    - name: Check asynctask dependency boundaries
      run: bash scripts/check-asynctask-deps.sh

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.15.0
        github-token: ${{ secrets.GITHUB_TOKEN }}
        only-new-issues: true
        # golangci-lint-action@v8 起使用 `args` 传参（v2 已废弃 --out-format）
        args: --config=.golangci.yml --timeout=20m --issues-exit-code=0